name: web-engineer-quiz-infra

services:
  mysql:
    image: mysql:8.4.13
    container_name: mysql
    env_file:
      - ./db/.env
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    # プロジェクト名を付ける前（旧リポジトリ名 express-mysql-docker のころ）に作ったボリュームを使い続ける。
    # name を外すと compose は web-engineer-quiz-infra_mysql_data という空のボリュームを新しく作る
    name: express-mysql-docker_mysql_data